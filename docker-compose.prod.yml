services:
  postgres:
    image: postgres:16-alpine
    container_name: ad_utility_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-ad_utility_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ad_utility_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_prod_net

  redis:
    image: redis:7-alpine
    container_name: ad_utility_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password} --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_secure_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_prod_data:/data
    networks:
      - internal_prod_net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ad_utility_backend_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-4080}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_secure_password@postgres:5432/ad_utility_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://:redis_secure_password@redis:6379}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://187.127.158.24:3080,http://localhost:3080,http://localhost:3000,https://tools.yourdomain.com}
      TRUST_PROXY: "true"
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/prisma:/app/apps/backend/prisma
      - ./apps/backend/img:/app/apps/backend/img
    networks:
      - internal_prod_net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/utility}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://stock-247.com/utility}
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-}
    container_name: ad_utility_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/utility}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://stock-247.com/utility}
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-}
      INTERNAL_API_URL: http://backend:4000/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/utility || wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./apps/frontend/public:/app/apps/frontend/public
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal_prod_net

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  internal_prod_net:
    driver: bridge
