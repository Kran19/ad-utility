services:
  postgres:
    image: postgres:16-alpine
    container_name: ad_utility_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: ad_utility_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ad_utility_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ad_utility_redis
    restart: always
    command: redis-server --requirepass redis_secure_password
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis_secure_password ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: ad_utility_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres_secure_password@postgres:5432/ad_utility_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secure_password
      REDIS_URL: redis://:redis_secure_password@redis:6379
      JWT_SECRET: super_secret_jwt_key_change_in_production_min_32_chars
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: super_secret_refresh_key_change_in_production
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:3000,http://127.0.0.1:3001
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: ad_utility_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      INTERNAL_API_URL: http://backend:4000/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
